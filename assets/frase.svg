<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" role="img" aria-label="O primeiro passo para o fracasso e o depois eu faco">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0033"/>
      <stop offset="50%" stop-color="#8B008B"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="120" rx="14" fill="url(#g)"/>
  <text x="320" y="52" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#ffffff">
    <tspan x="320" dy="0">O primeiro passo para o fracasso é o</tspan>
    <tspan x="320" dy="32">"depois eu faço"</tspan>
  </text>
</svg>
